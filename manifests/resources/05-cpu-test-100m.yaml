apiVersion: v1
kind: Pod
metadata:
  name: cpu-test
  namespace: resources-lab
  labels:
    app: cpu-test
spec:
  restartPolicy: Never
  containers:
  - name: python
    image: python:3.12-slim
    command:
    - python3
    - -u
    - -c
    - |-
      while True:
          pass
    resources:
      requests:
        cpu: 100m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 128Mi
