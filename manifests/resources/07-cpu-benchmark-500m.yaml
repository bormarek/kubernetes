apiVersion: v1
kind: Pod
metadata:
  name: cpu-benchmark
  namespace: resources-lab
  labels:
    app: cpu-benchmark
spec:
  restartPolicy: Never
  containers:
  - name: python
    image: python:3.12-slim
    command:
    - python3
    - -u
    - -c
    - |-
      import time
      start = time.perf_counter()
      result = sum(i * i for i in range(5_000_000))
      elapsed = time.perf_counter() - start
      print(f"Result: {result}")
      print(f"Execution time: {elapsed:.3f} seconds")
    resources:
      requests:
        cpu: 100m
        memory: 16Mi
      limits:
        cpu: 500m
        memory: 128Mi
