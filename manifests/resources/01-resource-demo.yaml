apiVersion: v1
kind: Pod
metadata:
  name: resource-demo
  namespace: resources-lab
  labels:
    app: resource-demo
spec:
  restartPolicy: Never
  containers:
  - name: python
    image: python:3.12-slim
    command:
    - python3
    - -u
    - -c
    - |-
      import time
      buf = bytearray(20 * 1024 * 1024)
      print("Przydzielono 20 MiB; oczekiwanie")
      time.sleep(3600)
    resources:
      requests:
        cpu: 100m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 128Mi
