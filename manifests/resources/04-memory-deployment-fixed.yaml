apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-demo
  namespace: resources-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-demo
  template:
    metadata:
      labels:
        app: memory-demo
    spec:
      containers:
      - name: python
        image: python:3.12-slim
        command:
        - python3
        - -u
        - -c
        - |-
          import time
          print("Próba alokacji 100 MiB", flush=True)
          buf = bytearray(100 * 1024 * 1024)
          print("Przydzielono 100 MiB", flush=True)
          time.sleep(3600)
        resources:
          requests:
            cpu: 100m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 256Mi
